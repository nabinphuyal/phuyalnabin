<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेपाल जियो-इन्टेलिजेन्स पोर्टल | Nepal 77 Districts Master GIS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0ea5e9;
            --accent: #f43f5e;
            --gold: #fbbf24;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mukta', 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%);
        }

        header {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 2000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand h1 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            width: 380px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 20px 10px 45px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            transition: 0.3s ease;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 480px;
            height: calc(100vh - 70px);
        }

        #map-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #020617;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .info-sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .stat-item h3 {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .stat-item p {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .default-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .default-state i {
            font-size: 4rem;
            background: linear-gradient(45deg, #f43f5e, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .detail-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .district-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .district-title {
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .badge {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            font-size: 0.75rem;
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: 700;
        }

        .palika-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 1.5rem;
            overflow-y: auto;
            padding-right: 8px;
            flex: 1;
        }

        .palika-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .palika-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateX(6px);
        }

        .palika-detail {
            margin-top: 10px;
            background: rgba(2, 6, 23, 0.8);
            border-radius: 14px;
            padding: 15px;
            border-left: 3px solid var(--gold);
            animation: fadeIn 0.3s ease;
        }

        .attraction-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin: 4px;
            border: 1px solid rgba(251, 191, 36, 0.2);
            text-decoration: none;
            transition: 0.3s;
        }

        .attraction-tag:hover {
            background: rgba(251, 191, 36, 0.25);
            transform: translateY(-2px);
        }

        .district-label {
            background: rgba(2, 6, 23, 0.8) !important;
            border: 1px solid rgba(56, 189, 248, 0.5) !important;
            color: #f8fafc !important;
            font-weight: 700 !important;
            font-size: 0.7rem !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3) !important;
            text-shadow: 0 0 5px rgba(0,0,0,0.8) !important;
            white-space: nowrap !important;
        }

        .video-container {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .special-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: 45vh 1fr;
            }
            .search-box { width: 200px; }
            .brand h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-earth-asia fa-2x" style="color: #38bdf8;"></i>
            <div>
                <h1>नेपाल जियो-इन्टेलिजेन्स पोर्टल</h1>
                <small style="color: #64748b; font-size: 0.7rem; letter-spacing: 1px;">NEPAL 77 DISTRICTS MASTER GIS</small>
            </div>
        </div>
        
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="जिल्ला वा गाउँ/नगरपालिका खोज्नुहोस्..." onkeyup="searchLocation()">
        </div>
    </header>

    <div class="app-container">
        <div id="map-container">
            <div id="map"></div>
            <div style="position: absolute; bottom: 25px; left: 25px; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--glass-border); z-index: 1000; color: #cbd5e1; font-size: 0.85rem; display: flex; align-items: center; gap: 10px;">

            </div>
        </div>

        <div class="info-sidebar">
            <div class="stats-bar">
                <div class="stat-item"><h3>७</h3><p>प्रदेश</p></div>
                <div class="stat-item"><h3>७७</h3><p>जिल्ला</p></div>

                <p style="margin-top: 10px; font-size: 0.9rem;">नक्सामा थिचेर वा माथिको सर्च बक्समा टाइप गरेर कुनै पनि जिल्ला वा गाउँपालिका/नगरपालिकाको सम्पूर्ण बायोडाटा हेर्नुहोस्।</p>
            </div>

            <div id="dynamicContent" style="display: none;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        // Helper to find Nepali Name from English GeoJSON Name
        function getNepaliName(engName) {
            if (!engName) return "Unknown";
            for (let key in nepal77Database) {
                if (key.toLowerCase() === engName.toLowerCase() || 
                    nepal77Database[key].name === engName) {
                    return nepal77Database[key].name;
                }
            }
            for (let key in nepal77Database) {

                    key.toLowerCase().includes(engName.toLowerCase())) {

            }

                        };
                    },
                    onEachFeature: (feature, layer) => {
                        const engName = feature.properties.DIST_NAME || feature.properties.name || "District";
                        const nepName = getNepaliName(engName);
                        
                        // Permanent label with Nepali Name
                        layer.bindTooltip(nepName, { 
                            permanent: true, 
                            direction: "center", 
                            className: 'district-label',
                            opacity: 0.9
                        });

                        layer.on({
                            mouseover: (e) => {
                                e.target.setStyle({ weight: 3, color: '#fbbf24', fillOpacity: 0.9 });
                                e.target.bringToFront();
                            },
                            mouseout: (e) => {
                                geojsonLayer.resetStyle(e.target);
                            },
                            click: (e) => {
                                map.fitBounds(e.target.getBounds(), { padding: [50, 50] });
                                renderDistrictDetails(nepName);
                            }
                        });
                    }
                }).addTo(map);
            })
            .catch(err => console.log("GIS Map Fetching Error:", err));

        // 4. Render Sidebar Information
        function renderDistrictDetails(queryKey) {
            document.getElementById('defaultState').style.display = 'none';
            const container = document.getElementById('dynamicContent');
            container.style.display = 'block';

            let matchedKey = Object.keys(nepal77Database).find(key => 
                key.toLowerCase() === queryKey.toLowerCase() || 
                nepal77Database[key].name === queryKey
            );

            if(!matchedKey) {
                matchedKey = Object.keys(nepal77Database).find(key => 
                    key.toLowerCase().includes(queryKey.toLowerCase()) || 
                    nepal77Database[key].name.includes(queryKey)
                );
            }

            if (!matchedKey) {
                container.innerHTML = `
                    <div class="detail-card">
                        <div class="district-header">
                            <span class="district-title">${queryKey}</span>
                            <span class="badge">नेपाल</span>
                        </div>
                        <p style="color: #cbd5e1;">यस जिल्लाको विवरण भेटिएन। कृपया अर्को जिल्ला छान्नुहोस्।</p>
                    </div>
                `;
                return;
            }

            const data = nepal77Database[matchedKey];
            const isBhojpur = matchedKey === "Bhojpur";

            let palikaHTML = '';
            data.palikas.forEach((p, idx) => {
                let spotsHTML = p.spots.map(s => {
                    const mapQuery = encodeURIComponent(s + ', ' + data.name + ', Nepal');
                    return `<a href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" class="attraction-tag"><i class="fa-solid fa-map-pin"></i> ${s}</a>`;
                }).join('');
                
                palikaHTML += `
                    <div class="palika-item" onclick="togglePalikaDetail(${idx})">
                        <div><strong>${p.name}</strong> <small style="color: #94a3b8; display:block;">${p.type}</small></div>
                        <i class="fa-solid fa-chevron-down" id="icon-${idx}" style="transition: 0.3s;"></i>
                    </div>
                    <div class="palika-detail" id="palika-detail-${idx}" style="display: none;">
                        <span style="color: #fbbf24; font-size: 0.85rem; font-weight: 600; display:block; margin-bottom: 8px;"><i class="fa-solid fa-camera"></i> मुख्य आकर्षणहरू (क्लिक गर्नुहोस् - गुगल म्याप):</span>
                        <div>${spotsHTML}</div>
                    </div>
                `;
            });

            let videoHTML = '';
            if(isBhojpur) {
                videoHTML = `
                    <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <i class="fa-brands fa-youtube" style="color: #ff0000; font-size: 1.5rem;"></i>
                            <span style="color: #ff0000; font-weight: 700;">भोजपुर विशेष भिडियो</span>
                            <span class="special-badge">गृह जिल्ला</span>
                        </div>
                        <div class="video-container">
                            <iframe src="https://www.facebook.com/share/r/1Bvb5yA2eG/" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="detail-card">
                    <div class="district-header">
                        <span class="district-title">${data.name} ${isBhojpur ? '<span class="special-badge">🏠 गृह जिल्ला</span>' : ''}</span>
                        <span class="badge">${data.province}</span>
                    </div>
                    <p style="margin-bottom: 6px; font-size: 0.95rem; color: #cbd5e1;"><strong>सदरमुकाम:</strong> ${data.headquarter}</p>
                    <p style="font-size: 0.95rem; margin-bottom: 10px; color: #cbd5e1;"><strong>स्थानीय तहको सङ्ख्या:</strong> ${data.palikas.length}</p>
                    
                    <strong style="color: #38bdf8; display:block; margin-top: 15px; font-size: 1.1rem;">
                        <i class="fa-solid fa-building"></i> स्थानीय तह र पर्यटकीय स्थलहरू:
                    </strong>
                    <div class="palika-list">
                        ${palikaHTML}
                    </div>
                    ${videoHTML}
                </div>
            `;
        }

        // Toggle Accordion Details for Palikas
        function togglePalikaDetail(index) {
            const el = document.getElementById(`palika-detail-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (el.style.display === "none") {
                el.style.display = "block";
                icon.style.transform = "rotate(180deg)";
            } else {
                el.style.display = "none";
                icon.style.transform = "rotate(0deg)";
            }
        }

        // Live Search Handler
        function searchLocation() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (q.length >= 2) {
                for (let key in nepal77Database) {
                    const item = nepal77Database[key];
                    if (key.toLowerCase().includes(q) || item.name.includes(q)) {
                        renderDistrictDetails(key);
                        if(geojsonLayer){
                            geojsonLayer.eachLayer(layer => {
                                const engName = layer.feature.properties.DIST_NAME || layer.feature.properties.name;
                                const nepName = getNepaliName(engName);
                                if(nepName === item.name){
                                    map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                                    layer.setStyle({ weight: 3, color: '#fbbf24', fillOpacity: 0.9 });
                                    setTimeout(() => geojsonLayer.resetStyle(layer), 3000);
                                }
                            });
                        }
                        break;
                    }
                }
            }
        }
    </script>
</body>
</html>
