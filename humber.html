<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularity - Nabin Phuyal</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary: #1a2634;
            --accent: #ffd700;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Mukta', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }

        /* Card Layout */
        .post-card {
            background: var(--card-bg);
            border-left: 4px solid var(--accent);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            border-left-width: 4px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .post-badge {
            background: var(--primary);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .post-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .post-title {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            margin: 6px 0;
        }

        .post-text {
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-line;
            color: #475569;
            margin-bottom: 12px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .author-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
        }

        .share-btn {
            background: var(--primary);
            color: var(--accent);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .share-btn:active { transform: scale(0.95); }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none;
        }
        .submit-btn {
            width: 100%; background: var(--primary); color: var(--accent); border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- App Container -->
    <div id="postsContainer"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP5Eu6vCrsUYjVuBiYRh-V6EhcSHaWeZ-i-lin6OOZBYlts0rgfauldsmDN9nYKCsJ/exec"; // तपाईंको Script URL यहाँ राख्नुहोस्

        // १. Approved पोष्टहरू ल्याउने र Views र Shares सहित देखाउने
        async function loadApprovedPosts() {
            const container = document.getElementById('postsContainer');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getApproved`);
                const posts = await res.json();
                
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">कुनै पनि स्वीकृत सामग्री भेटिएन।</p>';
                    return;
                }

                let html = '';
                posts.forEach(post => {
                    html += `
                        <div class="post-card" id="card-${post.id}">
                            <div class="post-header">
                                <span class="post-badge">${post.type}</span>
                                <div class="post-stats">
                                    <span><i class="fa-solid fa-eye"></i> <span id="view-${post.id}">${post.views}</span> Views</span>
                                    <span><i class="fa-solid fa-share-nodes"></i> <span id="share-${post.id}">${post.shares}</span> Shares</span>
                                </div>
                            </div>
                            ${post.title ? `<div class="post-title">${post.title}</div>` : ''}
                            <div class="post-text">${post.content}</div>
                            <div class="post-footer">
                                <div class="author-pill">
                                    <i class="fa-solid fa-user-pen"></i> - ${post.author}
                                </div>
                                <button class="share-btn" onclick="sharePost('${post.id}', '${post.title || post.type}', '${post.author}')">
                                    <i class="fa-solid fa-share"></i> Share
                                </button>
                            </div>
                        </div>
                    `;
                    
                    // स्क्रोल गरेर कार्ड हेर्दा Automatic View Count गर्ने Logic
                    trackView(post.id);
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="text-align:center; color:red;">डाटा लोड गर्न सकिएन।</p>';
            }
        }

        // २. Real View Tracker
        function trackView(postId) {
            fetch(`${SCRIPT_URL}?action=incrementView&id=${postId}`);
        }

        // ३. Dynamic Share Tracker & Native Share Popup
        async function sharePost(postId, title, author) {
            const shareData = {
                title: title,
                text: `"${title}" - ${author} को उत्कृष्ट रचना पढ्नुहोस्।`,
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link Copied to Clipboard!");
                }
                
                // Share Count बढाउने API Call
                fetch(`${SCRIPT_URL}?action=incrementShare&id=${postId}`);
                
                // UI मा सँगै संख्या बढाउने
                const shareElem = document.getElementById(`share-${postId}`);
                if (shareElem) shareElem.innerText = parseInt(shareElem.innerText) + 1;

            } catch (err) {
                console.log('Share canceled');
            }
        }

        // ४. Form Submission Logic (माथिको Form बाट डाटा पठाउन)
        async function submitPoetry(formData) {
            const payload = {
                action: 'submit',
                type: formData.type, // कविता, भनाइ, गजल, मुक्तक आदि
                title: formData.title,
                author: formData.author,
                content: formData.content
            };

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert('तपाईंको रचना समीक्षाका लागि पठाइयो। स्वीकृत भएपछि यहाँ प्रकाशित हुनेछ!');
        }

        // लोड हुँदा पोष्टहरू देखाउने
        loadApprovedPosts();
    </script>
</body>
</html>
