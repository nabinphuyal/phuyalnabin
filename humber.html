<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularity - Nabin Phuyal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f1f5f9; 
            color: #333; 
            min-height: 100vh;
            padding: 15px;
        }

        /* Demo Header with Hamburger Icon */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .navbar h1 { font-size: 18px; color: #1a2634; }
        .menu-btn {
            background: #1a2634;
            color: #ffd700;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Bottom Sheet Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            transition: 0.3s;
        }
        .modal-overlay.active { display: flex; }

        /* Modal Container */
        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 20px 30px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 15px;
        }
        .modal-header h3 { font-size: 16px; color: #1a2634; display: flex; align-items: center; gap: 8px; }
        .close-modal-btn {
            background: #f1f5f9;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        /* Modal Options (Photo Style) */
        .option-btn {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2634;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

        /* Content Sections inside Modal */
        .modal-content-section { display: none; }
        .modal-content-section.active { display: block; }

        .back-to-opts {
            background: none;
            border: none;
            color: #1a2634;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Post Card & Form */
        .post-card {
            background: #f8fafc;
            border-left: 4px solid #ffd700;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .post-type { font-size: 11px; background: #1a2634; color: #ffd700; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
        .post-text { font-size: 13px; color: #334155; margin: 6px 0; white-space: pre-line; }
        .post-author { font-size: 11px; font-weight: 700; text-align: right; color: #1a2634; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none;
        }
        .submit-btn {
            width: 100%; background: #1a2634; color: #ffd700; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sample Navbar -->
    <div class="navbar">
        <h1>Popularity</h1>
        <button class="menu-btn" onclick="openModal()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- MAIN BOTTOM SHEET MODAL -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            
            <!-- Modal Header -->
            <div class="modal-header">
                <h3><i class="fa-solid fa-list-check" style="color: #ffd700;"></i> अप्सनहरू छान्नुहोस्</h3>
                <button class="close-modal-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- STEP 1: Main Menu Options (Like your Screenshot) -->
            <div id="optionsView">
                <button class="option-btn" onclick="showSection('approvedView')">
                    <i class="fa-solid fa-book-open"></i>
                    <span>यहाँ राखिएका सबै कविता र भनाइहरू हेर्नुहोस्</span>
                </button>

                <button class="option-btn" onclick="showSection('submitView')">
                    <i class="fa-solid fa-pen-nib"></i>
                    <span>के तपाईं पनि आफ्ना कविता तथा भनाइ राख्न चाहनुहुन्छ?</span>
                </button>
            </div>

            <!-- STEP 2: Option 1 - Approved Content Section -->
            <div id="approvedView" class="modal-content-section">
                <button class="back-to-opts" onclick="showSection('optionsView')"><i class="fa-solid fa-arrow-left"></i> पछाडि फर्कनुहोस्</button>
                <div id="approvedContainer">
                    <p style="text-align: center; font-size: 12px; color: #64748b;">लोड हुँदैछ...</p>
                </div>
            </div>

            <!-- STEP 3: Option 2 - Submit Form Section -->
            <div id="submitView" class="modal-content-section">
                <button class="back-to-opts" onclick="showSection('optionsView')"><i class="fa-solid fa-arrow-left"></i> पछाडि फर्कनुहोस्</button>
                <form id="submissionForm">
                    <div class="form-group">
                        <label>तपाईंको नाम *</label>
                        <input type="text" id="userName" required placeholder="पूरा नाम लेख्नुहोस्">
                    </div>
                    <div class="form-group">
                        <label>प्रकार छान्नुहोस् *</label>
                        <select id="contentType" required>
                            <option value="कविता">कविता</option>
                            <option value="भनाइ">भनाइ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>शीर्षक (वैकल्पिक)</label>
                        <input type="text" id="contentTitle" placeholder="शीर्षक">
                    </div>
                    <div class="form-group">
                        <label>सामग्री *</label>
                        <textarea id="contentBody" rows="3" required placeholder="यहाँ लेख्नुहोस्..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">पठाउनुहोस्</button>
                    <div id="status-msg" style="text-align: center; font-size: 12px; margin-top: 8px;"></div>
                </form>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWP5ONKPBIqfgSd4t5zrTw9l6nW8DuwCU7pa_ZCREOeMtrMCOAEb29fXRGBYVRN9zV/exec";
";

        function openModal() {
            document.getElementById('customModal').classList.add('active');
            showSection('optionsView');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function showSection(sectionId) {
            document.getElementById('optionsView').style.display = 'none';
            document.querySelectorAll('.modal-content-section').forEach(sec => sec.classList.remove('active'));

            if(sectionId === 'optionsView') {
                document.getElementById('optionsView').style.display = 'block';
            } else {
                document.getElementById(sectionId).classList.add('active');
                if(sectionId === 'approvedView') loadApprovedPosts();
            }
        }

        async function loadApprovedPosts() {
            const container = document.getElementById('approvedContainer');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getApproved`);
                const posts = await res.json();
                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center; font-size: 12px; color: #94a3b8;">कुनै पनि स्वीकृत पोस्ट छैन।</p>';
                    return;
                }
                let html = '';
                posts.forEach(post => {
                    html += `
                        <div class="post-card">
                            <span class="post-type">${post.type} ${post.title ? '- ' + post.title : ''}</span>
                            <div class="post-text">${post.content}</div>
                            <div class="post-author">- ${post.name}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; font-size: 12px; color: #dc2626;">डाटा लोड भएन।</p>';
            }
        }

        document.getElementById('submissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('status-msg');
            btn.disabled = true;
            btn.innerText = 'पठाउँदैछ...';

            const payload = {
                action: 'submit',
                name: document.getElementById('userName').value,
                type: document.getElementById('contentType').value,
                title: document.getElementById('contentTitle').value,
                content: document.getElementById('contentBody').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                msg.style.color = '#16a34a';
                msg.innerText = '✓ सफलतापूर्वक पठाइयो!';
                document.getElementById('submissionForm').reset();
            } catch (err) {
                msg.style.color = '#dc2626';
                msg.innerText = 'त्रुटि भयो!';
            } finally {
                btn.disabled = false;
                btn.innerText = 'पठाउनुहोस्';
            }
        });
    </script>
</body>
</html>
