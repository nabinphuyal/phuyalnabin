<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu & Submissions - Nabin Phuyal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #1a2634, #2c3e50); 
            min-height: 100vh; 
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 20px;
            color: #1a2634;
            font-weight: 700;
        }

        .close-btn {
            background: #f1f5f9;
            color: #1a2634;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }
        .close-btn:hover {
            background: #e2e8f0;
            transform: rotate(90deg);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* SECTION 1: PUBLIC APPROVED POSTS STYLING */
        .public-posts-wrapper {
            margin-bottom: 30px;
        }

        .post-card {
            background: #f8fafc;
            border-left: 4px solid #ffd700;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .post-type {
            font-size: 11px;
            background: #1a2634;
            color: #ffd700;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .post-text {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            white-space: pre-line;
            margin-bottom: 8px;
        }

        .post-author {
            font-size: 12px;
            font-weight: 700;
            color: #1a2634;
            text-align: right;
        }

        /* SECTION 2: SUBMISSION FORM STYLING */
        .submission-form-wrapper {
            border-top: 2px dashed #e2e8f0;
            padding-top: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #1a2634;
            box-shadow: 0 0 0 3px rgba(26, 38, 52, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: #1a2634;
            color: #ffd700;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #2c3e50;
        }

        #status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h2><i class="fa-solid fa-bars-staggered" style="color: #ffd700;"></i> मेनु र पोस्टहरू</h2>
            <a href="index.html" class="close-btn" title="Close"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <!-- 1ST SECTION: APPROVED POSTS (पब्लिक देखिने ठाउँ) -->
        <div class="public-posts-wrapper">
            <div class="section-title">
                <i class="fa-solid fa-circle-check" style="color: #16a34a;"></i>
                १. स्वीकृत (Approved) कविता तथा भनाइहरू
            </div>

            <div id="approvedPostsContainer">
                <p style="text-align: center; font-size: 12px; color: #64748b;">लोड हुँदैछ...</p>
            </div>
        </div>

        <!-- 2ND SECTION: SUBMISSION FORM (पेस गर्ने ठाउँ) -->
        <div class="submission-form-wrapper">
            <div class="section-title">
                <i class="fa-solid fa-pen-to-square" style="color: #1a2634;"></i>
                २. आफ्ना कविता वा भनाइ पेस गर्नुहोस्
            </div>

            <form id="submissionForm">
                <div class="form-group">
                    <label>तपाईंको नाम *</label>
                    <input type="text" id="userName" placeholder="तपाईंको पूरा नाम लेख्नुहोस्" required>
                </div>

                <div class="form-group">
                    <label>प्रकार छान्नुहोस् *</label>
                    <select id="contentType" required>
                        <option value="कविता">कविता (Poem)</option>
                        <option value="भनाइ">भनाइ (Quote)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>शीर्षक (यदि कविता भएमा)</label>
                    <input type="text" id="contentTitle" placeholder="कविताको शीर्षक (वैकल्पिक)">
                </div>

                <div class="form-group">
                    <label>सामग्री (कविता वा भनाइ) *</label>
                    <textarea id="contentBody" rows="4" placeholder="यहाँ आफ्नो कविता वा भनाइ लेख्नुहोस्..." required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i> पोस्ट पठाउनुहोस्
                </button>
                
                <div id="status-msg"></div>
            </form>
        </div>
    </div>

    <script>
        // 👇 Google Apps Script Deployment Web App URL यहाँ राख्नुहोस् 👇
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWP5ONKPBIqfgSd4t5zrTw9l6nW8DuwCU7pa_ZCREOeMtrMCOAEb29fXRGBYVRN9zV/exec";

        // 1. Load and Display Approved Posts First
        async function loadApprovedPosts() {
            const container = document.getElementById('approvedPostsContainer');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getApproved`);
                const posts = await res.json();

                if (!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center; font-size: 13px; color: #94a3b8;">अहिलेसम्म कुनै पोस्ट स्वीकृत गरिएको छैन।</p>';
                    return;
                }

                let html = '';
                posts.forEach(post => {
                    html += `
                        <div class="post-card">
                            <span class="post-type">${post.type} ${post.title ? '- ' + post.title : ''}</span>
                            <div class="post-text">${post.content}</div>
                            <div class="post-author">- ${post.name}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; font-size: 12px; color: #dc2626;">डाटा लोड गर्न सकिएन।</p>';
            }
        }

        // 2. Submit Form Data to Google Sheet
        document.getElementById('submissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> पठाउँदैछ...';
            msg.innerText = '';

            const payload = {
                action: 'submit',
                name: document.getElementById('userName').value,
                type: document.getElementById('contentType').value,
                title: document.getElementById('contentTitle').value,
                content: document.getElementById('contentBody').value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                msg.style.color = '#16a34a';
                msg.innerText = '✓ सफलतापूर्वक पठाइयो! स्वीकृत (APPROVED) भएपछि माथिल्लो १st Section मा देखिनेछ।';
                document.getElementById('submissionForm').reset();
            } catch (err) {
                msg.style.color = '#dc2626';
                msg.innerText = 'त्रुटि भयो, कृपया पुनः प्रयास गर्नुहोस्।';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> पोस्ट पठाउनुहोस्';
            }
        });

        // Initialize on page load
        window.onload = loadApprovedPosts;
    </script>
</body>
</html>
