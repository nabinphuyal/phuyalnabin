
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabin Note - Calculate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; padding: 20px; }
        .container { max-width: 950px; margin: auto; }
        
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-top: 20px; }
        .card h2 { color: #1a2634; margin-bottom: 20px; }
        .card h3 { color: #1a2634; margin: 15px 0 10px 0; }
        
        .input-group { display: flex; gap: 15px; flex-wrap: wrap; margin: 15px 0; }
        .input-group input { flex: 1; min-width: 150px; padding: 14px 20px; border: 2px solid #eef2f6; border-radius: 15px; font-size: 1rem; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #1a2634; box-shadow: 0 0 0 4px rgba(26,38,52,0.1); }
        .input-group input:first-child { flex: 2; }
        
        .btn { padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.4s; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(90deg, #1a2634, #2c3e50); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(26,38,52,0.3); }
        .btn-success { background: #2e7d32; color: white; }
        .btn-success:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(46,125,50,0.3); }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(211,47,47,0.3); }
        .btn-warning { background: #f9a825; color: #1a2634; }
        .btn-warning:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(249,168,37,0.3); }
        .btn-secondary { background: #eef2f6; color: #1a2634; border: 2px solid #1a2634; }
        .btn-secondary:hover { background: #1a2634; color: white; transform: translateY(-3px); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 30px; }
        
        .hidden { display: none !important; }
        
        .note-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; background: #f8fafd; border-radius: 12px; margin-bottom: 8px; border-left: 4px solid #1a2634; }
        .note-item .sn { font-weight: 700; color: #1a2634; min-width: 40px; }
        .note-item .item-name { flex: 2; color: #333; }
        .note-item .item-amount { flex: 1; color: #1a2634; font-weight: 600; text-align: right; padding-right: 15px; }
        .note-item .action-btns { display: flex; gap: 6px; }
        .note-item .action-btns button { background: none; border: none; cursor: pointer; padding: 5px 8px; border-radius: 8px; transition: 0.3s; font-size: 1rem; }
        .note-item .action-btns .edit-btn { color: #f9a825; }
        .note-item .action-btns .edit-btn:hover { background: #fff8e1; }
        .note-item .action-btns .delete-btn { color: #d32f2f; }
        .note-item .action-btns .delete-btn:hover { background: #ffebee; }
        
        .total-display { background: linear-gradient(90deg, #1a2634, #2c3e50); color: white; padding: 15px 25px; border-radius: 15px; text-align: center; font-size: 1.3rem; font-weight: 700; margin: 15px 0; }
        .note-table-header { display: flex; background: #1a2634; color: white; padding: 12px 20px; font-weight: 600; gap: 15px; border-radius: 12px 12px 0 0; }
        .note-table-header span:first-child { min-width: 50px; }
        .note-table-header span:nth-child(2) { flex: 2; }
        .note-table-header span:nth-child(3) { flex: 1; text-align: right; padding-right: 55px; }
        .note-list-container { background: #f8fafd; border-radius: 0 0 12px 12px; border: 1px solid #eef2f6; border-top: none; }
        
        .action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a2634; color: white; padding: 15px 30px; border-radius: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; z-index: 999; animation: slideUp 0.4s; }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .login-info { background: #e8f5e9; padding: 12px 20px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .login-info strong { color: #2e7d32; }
        
        /* Edit Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: white; padding: 30px; border-radius: 25px; max-width: 450px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: formPop 0.4s; }
        @keyframes formPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .modal-box h3 { color: #1a2634; margin-bottom: 15px; }
        .modal-box input { width: 100%; padding: 14px 20px; border: 2px solid #eef2f6; border-radius: 15px; font-size: 1rem; outline: none; margin: 8px 0; }
        .modal-box input:focus { border-color: #1a2634; }
        .modal-box .btn-group { display: flex; gap: 12px; margin-top: 15px; }
        .modal-box .btn-group button { flex: 1; }
        
        @media (max-width: 600px) {
            .note-item { flex-wrap: wrap; }
            .note-item .item-amount { text-align: left; padding-left: 55px; flex-basis: 100%; }
            .note-table-header { flex-wrap: wrap; }
            .note-table-header span:nth-child(3) { padding-right: 15px; }
            .input-group { flex-direction: column; }
            .action-bar { justify-content: center; }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h3>✏️ Edit Note</h3>
        <input type="text" id="editName" placeholder="वस्तुको नाम">
        <input type="number" id="editAmount" placeholder="रकम" step="0.01">
        <div class="btn-group">
            <button class="btn btn-success" onclick="saveEdit()">💾 Save</button>
            <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        </div>
    </div>
</div>

<div class="container">

    <!-- ===== LOGIN PAGE ===== -->
    <div id="loginPage" class="card">
        <h2>🔑 Login</h2>
        <p style="color:#666; margin-bottom:15px;">तपाईंको ID र Name हाल्नुहोस्</p>
        <div class="input-group">
            <input type="number" id="loginId" placeholder="ID">
            <input type="text" id="loginName" placeholder="Name ">
            <button class="btn btn-primary" onclick="loginUser()">✅ Login</button>
        </div>
        <p style="margin-top:10px; font-size:0.9rem; color:#999;">⚠️ ID 1000-9999 सम्म, पहिले नै बनेको ID+Name ले मात्र Login हुन्छ</p>
    </div>

    <!-- ===== CREATE ACCOUNT PAGE ===== -->
    <div id="createPage" class="card hidden">
        <h2>📄 Create New Account</h2>
        <div class="input-group">
            <input type="number" id="createId" placeholder="ID (जस्तै: 2343)">
            <input type="text" id="createName" placeholder="Full Name">
        </div>
        <button class="btn btn-primary" onclick="createAccount()">✅ Create Account</button>
        <button class="btn btn-secondary" onclick="showLogin()" style="margin-top:10px;">← Back to Login</button>
    </div>

    <!-- ===== NOTE PAGE ===== -->
    <div id="notePage" class="hidden">
        <div class="card">
            <div class="login-info">
                <div>👤 <strong id="displayName">---</strong> | 🆔 <strong id="displayId">---</strong></div>
                <div>
                    <button class="btn btn-secondary btn-sm" onclick="logoutUser()">🚪 Logout</button>
                </div>
            </div>
            
            <h2>📝 My Notes</h2>
            
            <!-- Add Note -->
            <div class="input-group">
                <input type="text" id="noteName" placeholder="वस्तुको नाम (जस्तै: खोर्सानी)">
                <input type="number" id="noteAmount" placeholder="रकम (जस्तै: 12.5)" step="0.01">
                <button class="btn btn-primary" onclick="addNote()">➕ Add</button>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-bar">
                <button class="btn btn-secondary" onclick="downloadPDF(false)">📥 PDF (सबै)</button>
                <button class="btn btn-success" onclick="downloadPDF(true)">📊 PDF + Total</button>
                <button class="btn btn-warning" onclick="calculateTotal()">🧮 Calculate Total</button>
            </div>
            
            <!-- Total Display -->
            <div id="totalDisplay" class="total-display hidden">
                📊 Total: रु. <span id="totalValue">0</span>
            </div>
            
            <!-- Notes List -->
            <div style="margin-top:20px;">
                <div class="note-table-header">
                    <span>क्र.स.</span>
                    <span>वस्तु</span>
                    <span>रकम (रु.)</span>
                </div>
                <div class="note-list-container" id="noteList">
                    <p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन।</p>
                </div>
            </div>
            
            <p style="text-align:right; color:#999; font-size:0.9rem; margin-top:10px;" id="noteCount">कुल नोट: 0</p>
        </div>
    </div>

</div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyB8mJtY3H8mLNw2l5P5H7rXp3FqA2ZcYw", // तपाईंको config हाल्नुहोस्
        authDomain: "your-project.firebaseapp.com",
        databaseURL: "https://your-project-default-rtdb.firebaseio.com",
        projectId: "your-project",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    // तपाईंको Firebase config माथि हाल्नुहोस् ^^^^^

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ==================== GLOBAL VARIABLES ====================
    let currentUser = null;
    let currentNotes = [];
    let editIndex = null;

    // ==================== TOAST ====================
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // ==================== LOGIN / CREATE ====================
    function showLogin() {
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('createPage').classList.add('hidden');
        document.getElementById('notePage').classList.add('hidden');
    }

    function showCreate() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('createPage').classList.remove('hidden');
        document.getElementById('notePage').classList.add('hidden');
    }

    function createAccount() {
        const id = document.getElementById('createId').value.trim();
        const name = document.getElementById('createName').value.trim();

        if (!id || !name) {
            showToast('⚠️ कृपया ID र Name दुवै भर्नुहोस्!');
            return;
        }
        if (id.length < 4 || id.length > 4 || isNaN(id)) {
            showToast('⚠️ ID ४ अंकको (१०००-९९९९) मात्र!');
            return;
        }

        // Check if already exists
        database.ref('users/' + id).once('value').then(snapshot => {
            if (snapshot.exists()) {
                showToast('❌ यो ID पहिले नै प्रयोग भइसकेको छ!');
            } else {
                database.ref('users/' + id).set({
                    name: name,
                    notes: []
                }).then(() => {
                    showToast('✅ Account Created! ID: ' + id);
                    showLogin();
                });
            }
        });
    }

    function loginUser() {
        const id = document.getElementById('loginId').value.trim();
        const name = document.getElementById('loginName').value.trim();

        if (!id || !name) {
            showToast('⚠️ कृपया ID र Name दुवै भर्नुहोस्!');
            return;
        }

        database.ref('users/' + id).once('value').then(snapshot => {
            if (!snapshot.exists()) {
                showToast('❌ यो ID अवस्थित छैन! कृपया Create Account गर्नुहोस्।');
                return;
            }

            const userData = snapshot.val();
            if (userData.name.toLowerCase() !== name.toLowerCase()) {
                showToast('❌ Name मिलेन! कृपया सही Name लेख्नुहोस्।');
                return;
            }

            currentUser = { id: id, name: userData.name };
            currentNotes = userData.notes || [];

            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('createPage').classList.add('hidden');
            document.getElementById('notePage').classList.remove('hidden');

            document.getElementById('displayName').textContent = currentUser.name;
            document.getElementById('displayId').textContent = currentUser.id;

            renderNotes();
            showToast('✅ Welcome, ' + currentUser.name + '!');
        });
    }

    function logoutUser() {
        currentUser = null;
        currentNotes = [];
        document.getElementById('notePage').classList.add('hidden');
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('loginId').value = '';
        document.getElementById('loginName').value = '';
        showToast('🚪 Logged out!');
    }

    // ==================== NOTES CRUD ====================
    function addNote() {
        const name = document.getElementById('noteName').value.trim();
        const amount = document.getElementById('noteAmount').value.trim();

        if (!name) { showToast('⚠️ वस्तुको नाम लेख्नुहोस्!'); return; }
        if (!amount || isNaN(amount)) { showToast('⚠️ रकम लेख्नुहोस् (संख्या)!'); return; }

        currentNotes.push({ name: name, amount: parseFloat(amount) });
        saveNotes();
        renderNotes();
        document.getElementById('noteName').value = '';
        document.getElementById('noteAmount').value = '';
        document.getElementById('noteName').focus();
        showToast('✅ Note added!');
    }

    function deleteNote(index) {
        if (confirm('के तपाईं यो नोट मेटाउन चाहनुहुन्छ?')) {
            currentNotes.splice(index, 1);
            saveNotes();
            renderNotes();
            showToast('🗑️ Note deleted!');
        }
    }

    function editNote(index) {
        editIndex = index;
        const note = currentNotes[index];
        document.getElementById('editName').value = note.name;
        document.getElementById('editAmount').value = note.amount;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        editIndex = null;
    }

    function saveEdit() {
        const name = document.getElementById('editName').value.trim();
        const amount = document.getElementById('editAmount').value.trim();

        if (!name) { showToast('⚠️ वस्तुको नाम लेख्नुहोस्!'); return; }
        if (!amount || isNaN(amount)) { showToast('⚠️ रकम लेख्नुहोस् (संख्या)!'); return; }

        currentNotes[editIndex] = { name: name, amount: parseFloat(amount) };
        saveNotes();
        renderNotes();
        closeEditModal();
        showToast('✅ Note updated!');
    }

    function saveNotes() {
        if (currentUser) {
            database.ref('users/' + currentUser.id + '/notes').set(currentNotes);
        }
    }

    function renderNotes() {
        const container = document.getElementById('noteList');
        const countDisplay = document.getElementById('noteCount');

        if (currentNotes.length === 0) {
            container.innerHTML = `<p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन।</p>`;
            countDisplay.textContent = 'कुल नोट: 0';
            document.getElementById('totalDisplay').classList.add('hidden');
            return;
        }

        let html = '';
        currentNotes.forEach((note, i) => {
            html += `
                <div class="note-item">
                    <span class="sn">${i + 1}</span>
                    <span class="item-name">${escapeHTML(note.name)}</span>
                    <span class="item-amount">रु. ${note.amount.toFixed(2)}</span>
                    <div class="action-btns">
                        <button class="edit-btn" onclick="editNote(${i})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="delete-btn" onclick="deleteNote(${i})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        countDisplay.textContent = `कुल नोट: ${currentNotes.length}`;
        document.getElementById('totalDisplay').classList.add('hidden');
    }

    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== CALCULATE ====================
    function calculateTotal() {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन!');
            return;
        }

        let total = 0;
        currentNotes.forEach(note => { total += note.amount; });

        document.getElementById('totalValue').textContent = total.toFixed(2);
        document.getElementById('totalDisplay').classList.remove('hidden');
        showToast(`📊 Total: रु. ${total.toFixed(2)}`);
    }

    // ==================== PDF DOWNLOAD ====================
    function downloadPDF(includeTotal) {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन!');
            return;
        }

        let total = 0;
        currentNotes.forEach(note => { total += note.amount; });

        let tableRows = '';
        currentNotes.forEach((note, i) => {
            tableRows += `
                <tr style="border-bottom: 1px solid #eef2f6;">
                    <td style="padding: 10px 15px; font-weight:600; text-align:center;">${i+1}</td>
                    <td style="padding: 10px 15px;">${escapeHTML(note.name)}</td>
                    <td style="padding: 10px 15px; text-align:right;">रु. ${note.amount.toFixed(2)}</td>
                </tr>
            `;
        });

        let totalHTML = '';
        if (includeTotal) {
            totalHTML = `
                <div style="margin-top: 20px; background: #1a2634; color: white; padding: 15px 20px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 1.2rem;">
                    📊 Total: रु. ${total.toFixed(2)}
                </div>
            `;
        }

        let content = `
            <div style="font-family: 'Poppins', sans-serif; padding: 30px; max-width: 800px; margin: auto; position: relative;">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 80px; color: rgba(0,0,0,0.04); font-weight: 700; pointer-events: none; white-space: nowrap; z-index: 0;">
                    NABIN
                </div>
                <div style="position: relative; z-index: 1;">
                    <h1 style="color: #1a2634; border-bottom: 3px solid #1a2634; padding-bottom: 10px;">
                        📝 My Notes
                    </h1>
                    <p style="color: #555; margin: 15px 0 20px 0; font-size: 1rem;">
                        <strong>ID:</strong> ${currentUser.id} &nbsp;|&nbsp; 
                        <strong>Name:</strong> ${currentUser.name} &nbsp;|&nbsp; 
                        <strong>Date:</strong> ${new Date().toLocaleDateString()}
                    </p>
                    <hr style="margin: 20px 0; border-color: #eef2f6;">
                    <table style="width:100%; border-collapse: collapse; margin: 20px 0; font-size: 0.95rem;">
                        <thead>
                            <tr style="background: #1a2634; color: white; text-align: left;">
                                <th style="padding: 12px 15px; text-align:center;">क्र.स.</th>
                                <th style="padding: 12px 15px;">वस्तु</th>
                                <th style="padding: 12px 15px; text-align:right;">रकम (रु.)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    ${totalHTML}
                    <p style="margin-top: 30px; text-align: center; color: #999; font-size: 0.75rem; border-top: 2px solid #eef2f6; padding-top: 20px;">
                        Generated by Nabin Note App | © 2025 Nabin Phuyal
                    </p>
                </div>
            </div>
        `;

        const element = document.createElement('div');
        element.innerHTML = content;
        document.body.appendChild(element);

        const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `notes_${currentUser.id}_${new Date().toISOString().slice(0,10)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, letterRendering: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.removeChild(element);
            showToast('✅ PDF Downloaded!');
        }).catch(err => {
            document.body.removeChild(element);
            showToast('❌ PDF Error!');
            console.error(err);
        });
    }

    // ==================== AUTO LOGIN CHECK ====================
    window.onload = function() {
        showLogin();
    };
</script>

</body>
</html>
