<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabin Note App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }
        
        .container { max-width: 950px; margin: 0 auto; padding: 20px; }
        
        #homePage { text-align: center; padding: 80px 20px; }
        #homePage h1 { font-size: 3rem; color: #1a2634; margin-bottom: 10px; }
        #homePage .subtitle { color: #666; font-size: 1.2rem; margin-bottom: 40px; }
        
        .btn-primary { 
            background: linear-gradient(90deg, #1a2634, #2c3e50); 
            color: white; padding: 18px 50px; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: 600; 
            cursor: pointer; transition: 0.4s; box-shadow: 0 8px 25px rgba(26,38,52,0.3);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(26,38,52,0.4); }
        .btn-secondary { 
            background: #eef2f6; color: #1a2634; padding: 14px 35px; 
            border: 2px solid #1a2634; border-radius: 50px; font-size: 1rem; 
            font-weight: 600; cursor: pointer; transition: 0.4s; margin: 10px;
        }
        .btn-secondary:hover { background: #1a2634; color: white; }
        .btn-danger { background: #d32f2f; color: white; padding: 10px 25px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-danger:hover { background: #b71c1c; transform: scale(1.02); }
        .btn-success { background: #2e7d32; color: white; padding: 10px 25px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-success:hover { background: #1b5e20; transform: scale(1.02); }
        .btn-warning { background: #f9a825; color: #1a2634; padding: 10px 25px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-warning:hover { background: #f57f17; transform: scale(1.02); }
        
        #loginPage, #createPage, #notePage, #forgotPage { display: none; padding: 40px 30px; background: white; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-top: 20px; }
        .form-group { margin: 20px 0; }
        .form-group label { display: block; font-weight: 600; color: #1a2634; margin-bottom: 8px; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 14px 20px; border: 2px solid #eef2f6; 
            border-radius: 15px; font-size: 1rem; transition: 0.3s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #1a2634; box-shadow: 0 0 0 4px rgba(26,38,52,0.1); }
        
        .input-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .input-group input { flex: 1; min-width: 150px; }
        .input-group input:first-child { flex: 2; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eef2f6; }
        .header-bar h2 { color: #1a2634; }
        .file-info { background: #eef2f6; padding: 8px 20px; border-radius: 20px; font-weight: 600; color: #1a2634; }
        
        .action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
        
        .note-item { 
            display: flex; align-items: center; gap: 15px; 
            padding: 12px 20px; background: #f8fafd; border-radius: 12px; 
            margin-bottom: 8px; border-left: 4px solid #1a2634;
        }
        .note-item .sn { font-weight: 700; color: #1a2634; min-width: 40px; font-size: 1rem; }
        .note-item .item-name { flex: 2; color: #333; }
        .note-item .item-amount { flex: 1; color: #1a2634; font-weight: 600; text-align: right; padding-right: 15px; }
        .note-item .delete-btn { background: none; border: none; color: #d32f2f; font-size: 1.2rem; cursor: pointer; padding: 5px 10px; border-radius: 8px; transition: 0.3s; }
        .note-item .delete-btn:hover { background: #ffebee; }
        
        .total-display { 
            background: linear-gradient(90deg, #1a2634, #2c3e50); 
            color: white; padding: 15px 25px; border-radius: 15px; 
            text-align: center; font-size: 1.3rem; font-weight: 700; 
            margin: 15px 0; 
        }
        
        .forgot-link { color: #1a2634; cursor: pointer; text-decoration: underline; font-weight: 500; }
        .forgot-link:hover { color: #d32f2f; }
        
        .toast { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #1a2634; color: white; padding: 15px 30px; 
            border-radius: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            display: none; z-index: 999; animation: slideUp 0.4s;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .back-btn { background: none; border: none; color: #1a2634; font-size: 1.5rem; cursor: pointer; padding: 5px 15px; }
        .back-btn:hover { color: #d32f2f; }
        
        .note-table-header {
            display: flex;
            background: #1a2634;
            color: white;
            padding: 12px 20px;
            font-weight: 600;
            gap: 15px;
            border-radius: 12px 12px 0 0;
        }
        .note-table-header span:first-child { min-width: 50px; }
        .note-table-header span:nth-child(2) { flex: 2; }
        .note-table-header span:nth-child(3) { flex: 1; text-align: right; padding-right: 55px; }
        
        .note-list-container {
            background: #f8fafd;
            border-radius: 0 0 12px 12px;
            border: 1px solid #eef2f6;
            border-top: none;
        }
        
        @media (max-width: 600px) {
            #homePage h1 { font-size: 2rem; }
            .input-group { flex-direction: column; }
            .header-bar { flex-direction: column; text-align: center; }
            .action-bar { justify-content: center; }
            .note-item { flex-wrap: wrap; }
            .note-item .item-amount { text-align: left; padding-left: 55px; flex-basis: 100%; }
            .note-table-header { flex-wrap: wrap; }
            .note-table-header span:nth-child(3) { padding-right: 15px; }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">

    <!-- HOME PAGE -->
    <div id="homePage">
        <h1>📝 Nabin Note App</h1>
        <p class="subtitle">तपाईंको नोटहरू सुरक्षित राख्नुहोस्</p>
        <button class="btn-primary" onclick="showLoginPage()">🔑 Login</button>
        <br><br>
        <button class="btn-secondary" onclick="showCreatePage()">📄 Create New File</button>
        <br><br>
        <button class="btn-secondary" onclick="showForgotPage()" style="border-color:#d32f2f; color:#d32f2f;">🔑 Forget ID ?</button>
    </div>

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>🔑 Login</h2>
            <span></span>
        </div>
        <div class="form-group">
            <label>🆔 File ID</label>
            <input type="number" id="loginId" placeholder="जस्तै: 2343">
        </div>
        <div class="form-group">
            <label>👤 Full Name</label>
            <input type="text" id="loginName" placeholder="तपाईंको नाम">
        </div>
        <button class="btn-primary" onclick="loginUser()" style="width:100%;">✅ Login</button>
        <p style="text-align:center; margin-top:15px;">
            <span class="forgot-link" onclick="showForgotPage()">🔑 Forget ID?</span>
        </p>
    </div>

    <!-- CREATE PAGE -->
    <div id="createPage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>📄 Create New File</h2>
            <span></span>
        </div>
        <div class="form-group">
            <label>👤 Full Name</label>
            <input type="text" id="createName" placeholder="तपाईंको नाम">
        </div>
        <div class="form-group">
            <label>🆔 File ID (जस्तै: 2343)</label>
            <input type="number" id="createId" placeholder="Enter unique ID" min="1000" max="9999">
        </div>
        <div class="form-group">
            <label>📧 Gmail (For password reset)</label>
            <input type="email" id="createEmail" placeholder="your@gmail.com">
        </div>
        <button class="btn-primary" onclick="createFile()" style="width:100%;">✅ Create File</button>
    </div>

    <!-- FORGOT PAGE -->
    <div id="forgotPage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>🔑 Forgot ID</h2>
            <span></span>
        </div>
        <div class="form-group">
            <label>📧 Gmail</label>
            <input type="email" id="forgotEmail" placeholder="your@gmail.com">
        </div>
        <div class="form-group" id="otpSection" style="display:none;">
            <label>🔢 OTP Code</label>
            <input type="text" id="otpInput" placeholder="Enter OTP">
        </div>
        <button class="btn-primary" onclick="sendOTP()" style="width:100%;">📨 Send OTP</button>
        <button class="btn-secondary" onclick="verifyOTP()" style="width:100%; margin-top:10px;" id="verifyBtn" style="display:none;">✅ Verify</button>
        <div id="forgotResult" style="margin-top:20px; padding:15px; background:#f8fafd; border-radius:15px; display:none;"></div>
    </div>

    <!-- NOTE PAGE -->
    <div id="notePage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <div>
                <h2>📝 My Notes</h2>
                <span class="file-info" id="fileInfo">📁 ID: ---- | 👤 ----</span>
            </div>
            <div>
                <button class="btn-danger" onclick="deleteFile()" style="padding:8px 20px; font-size:0.9rem;">🗑️ Delete File</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>✏️ नयाँ नोट (वस्तु + रकम)</label>
            <div class="input-group">
                <input type="text" id="noteName" placeholder="वस्तुको नाम (जस्तै: खोर्सानी)">
                <input type="number" id="noteAmount" placeholder="रकम (जस्तै: 12.5)" step="0.01">
                <button class="btn-primary" onclick="addNote()" style="padding:12px 25px;">➕ Add</button>
            </div>
        </div>
        
        <div class="action-bar">
            <button class="btn-secondary" onclick="downloadPDF(false)">📥 PDF (सबै)</button>
            <button class="btn-success" onclick="downloadPDF(true)">📊 PDF + Total</button>
            <button class="btn-warning" onclick="calculateTotal()">🧮 Calculate Total</button>
        </div>
        
        <div id="totalDisplay" class="total-display" style="display:none;">
            📊 Total: रु. <span id="totalValue">0</span>
        </div>
        
        <div style="margin-top:20px;">
            <div class="note-table-header">
                <span>क्र.स.</span>
                <span>वस्तु</span>
                <span>रकम (रु.)</span>
            </div>
            <div class="note-list-container" id="noteList">
                <p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन।</p>
            </div>
        </div>
        
        <p style="text-align:right; color:#999; font-size:0.9rem; margin-top:10px;" id="noteCount">कुल नोट: 0</p>
    </div>

</div>

<script>
    // ==================== DATA ====================
    let files = JSON.parse(localStorage.getItem('nabinFiles')) || [];
    let currentFile = null;
    let currentNotes = [];
    let otpStorage = {};

    // ==================== NAVIGATION ====================
    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'none';
        currentFile = null;
        currentNotes = [];
    }

    function showLoginPage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'none';
    }

    function showCreatePage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('createPage').style.display = 'block';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'none';
    }

    function showForgotPage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'block';
        document.getElementById('otpSection').style.display = 'none';
        document.getElementById('verifyBtn').style.display = 'none';
        document.getElementById('forgotResult').style.display = 'none';
    }

    // ==================== LOGIN ====================
    function loginUser() {
        const id = document.getElementById('loginId').value.trim();
        const name = document.getElementById('loginName').value.trim();

        if (!id || !name) {
            showToast('⚠️ कृपया ID र Name दुवै भर्नुहोस्!');
            return;
        }

        const file = files.find(f => f.id === id && f.name.toLowerCase() === name.toLowerCase());
        if (!file) {
            showToast('❌ ID वा Name मिलेन!');
            return;
        }

        openFile(id);
        document.getElementById('loginId').value = '';
        document.getElementById('loginName').value = '';
    }

    // ==================== CREATE ====================
    function createFile() {
        const name = document.getElementById('createName').value.trim();
        const id = document.getElementById('createId').value.trim();
        const email = document.getElementById('createEmail').value.trim();

        if (!name || !id || !email) {
            showToast('⚠️ सबै फिल्ड भर्नुहोस्!');
            return;
        }

        if (id.length < 4 || id.length > 4 || isNaN(id)) {
            showToast('⚠️ ID ४ अंकको (१०००-९९९९) मात्र!');
            return;
        }

        if (files.find(f => f.id === id)) {
            showToast('❌ यो ID पहिले नै प्रयोग भइसकेको छ!');
            return;
        }

        const newFile = {
            id: id,
            name: name,
            email: email,
            notes: [],
            createdAt: new Date().toISOString()
        };

        files.push(newFile);
        localStorage.setItem('nabinFiles', JSON.stringify(files));
        showToast('✅ File Created! ID: ' + id);
        openFile(id);
    }

    // ==================== OPEN FILE ====================
    function openFile(id) {
        const file = files.find(f => f.id === id);
        if (!file) {
            showToast('❌ File not found!');
            return;
        }

        currentFile = file;
        currentNotes = file.notes || [];

        document.getElementById('homePage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'block';
        document.getElementById('forgotPage').style.display = 'none';

        document.getElementById('fileInfo').innerHTML = `📁 ID: ${file.id} | 👤 ${file.name}`;
        renderNotes();

        document.getElementById('createName').value = '';
        document.getElementById('createId').value = '';
        document.getElementById('createEmail').value = '';
    }

    // ==================== NOTES ====================
    function addNote() {
        const name = document.getElementById('noteName').value.trim();
        const amount = document.getElementById('noteAmount').value.trim();

        if (!name) {
            showToast('⚠️ वस्तुको नाम लेख्नुहोस्!');
            return;
        }
        if (!amount || isNaN(amount)) {
            showToast('⚠️ रकम लेख्नुहोस् (संख्या)!');
            return;
        }

        currentNotes.push({ name: name, amount: parseFloat(amount) });
        saveNotes();
        renderNotes();
        document.getElementById('noteName').value = '';
        document.getElementById('noteAmount').value = '';
        document.getElementById('noteName').focus();
        showToast('✅ Note added!');
    }

    function deleteNote(index) {
        if (confirm('के तपाईं यो नोट मेटाउन चाहनुहुन्छ?')) {
            currentNotes.splice(index, 1);
            saveNotes();
            renderNotes();
            showToast('🗑️ Note deleted!');
        }
    }

    function saveNotes() {
        if (currentFile) {
            const fileIndex = files.findIndex(f => f.id === currentFile.id);
            if (fileIndex !== -1) {
                files[fileIndex].notes = currentNotes;
                localStorage.setItem('nabinFiles', JSON.stringify(files));
            }
        }
    }

    function renderNotes() {
        const container = document.getElementById('noteList');
        const countDisplay = document.getElementById('noteCount');
        
        if (currentNotes.length === 0) {
            container.innerHTML = `<p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन।</p>`;
            countDisplay.textContent = 'कुल नोट: 0';
            document.getElementById('totalDisplay').style.display = 'none';
            return;
        }

        let html = '';
        currentNotes.forEach((note, i) => {
            html += `
                <div class="note-item">
                    <span class="sn">${i + 1}</span>
                    <span class="item-name">${escapeHTML(note.name)}</span>
                    <span class="item-amount">रु. ${note.amount.toFixed(2)}</span>
                    <button class="delete-btn" onclick="deleteNote(${i})">✕</button>
                </div>
            `;
        });
        container.innerHTML = html;
        countDisplay.textContent = `कुल नोट: ${currentNotes.length}`;
        document.getElementById('totalDisplay').style.display = 'none';
    }

    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== CALCULATE ====================
    function calculateTotal() {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन!');
            return;
        }

        let total = 0;
        currentNotes.forEach(note => { total += note.amount; });

        document.getElementById('totalValue').textContent = total.toFixed(2);
        document.getElementById('totalDisplay').style.display = 'block';
        showToast(`📊 Total: रु. ${total.toFixed(2)}`);
    }

    // ==================== DELETE FILE ====================
    function deleteFile() {
        if (!currentFile) return;
        if (confirm(`⚠️ ${currentFile.id} (${currentFile.name}) मेटाउन?`)) {
            files = files.filter(f => f.id !== currentFile.id);
            localStorage.setItem('nabinFiles', JSON.stringify(files));
            showToast('🗑️ File deleted!');
            goHome();
        }
    }

    // ==================== PDF DOWNLOAD ====================
    function downloadPDF(includeTotal) {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन!');
            return;
        }

        let total = 0;
        currentNotes.forEach(note => { total += note.amount; });

        // Build table rows
        let tableRows = '';
        currentNotes.forEach((note, i) => {
            tableRows += `
                <tr style="border-bottom: 1px solid #eef2f6;">
                    <td style="padding: 10px 15px; font-weight:600; text-align:center;">${i+1}</td>
                    <td style="padding: 10px 15px;">${escapeHTML(note.name)}</td>
                    <td style="padding: 10px 15px; text-align:right;">रु. ${note.amount.toFixed(2)}</td>
                </tr>
            `;
        });

        let totalHTML = '';
        if (includeTotal) {
            totalHTML = `
                <div style="margin-top: 20px; background: #1a2634; color: white; padding: 15px 20px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 1.2rem;">
                    📊 Total: रु. ${total.toFixed(2)}
                </div>
            `;
        }

        let content = `
            <div style="font-family: 'Poppins', sans-serif; padding: 30px; max-width: 800px; margin: auto; position: relative;">
                <!-- Watermark -->
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 80px; color: rgba(0,0,0,0.04); font-weight: 700; pointer-events: none; white-space: nowrap; z-index: 0;">
                    NABIN
                </div>
                
                <div style="position: relative; z-index: 1;">
                    <h1 style="color: #1a2634; border-bottom: 3px solid #1a2634; padding-bottom: 10px;">
                        📝 My Notes
                    </h1>
                    
                    <p style="color: #555; margin: 15px 0 20px 0; font-size: 1rem;">
                        <strong>ID:</strong> ${currentFile.id} &nbsp;|&nbsp; 
                        <strong>Name:</strong> ${currentFile.name} &nbsp;|&nbsp; 
                        <strong>Date:</strong> ${new Date().toLocaleDateString()}
                    </p>
                    
                    <hr style="margin: 20px 0; border-color: #eef2f6;">
                    
                    <table style="width:100%; border-collapse: collapse; margin: 20px 0; font-size: 0.95rem;">
                        <thead>
                            <tr style="background: #1a2634; color: white; text-align: left;">
                                <th style="padding: 12px 15px; text-align:center;">क्र.स.</th>
                                <th style="padding: 12px 15px;">वस्तु</th>
                                <th style="padding: 12px 15px; text-align:right;">रकम (रु.)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                    
                    ${totalHTML}
                    
                    <p style="margin-top: 30px; text-align: center; color: #999; font-size: 0.75rem; border-top: 2px solid #eef2f6; padding-top: 20px;">
                        Generated by Nabin Note App | © 2025 Nabin Phuyal
                    </p>
                </div>
            </div>
        `;

        const element = document.createElement('div');
        element.innerHTML = content;
        document.body.appendChild(element);

        const opt = {
            margin:        [0.5, 0.5, 0.5, 0.5],
            filename:     `notes_${currentFile.id}_${new Date().toISOString().slice(0,10)}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, letterRendering: true },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.removeChild(element);
            showToast('✅ PDF Downloaded!');
        }).catch(err => {
            document.body.removeChild(element);
            showToast('❌ PDF Error!');
            console.error(err);
        });
    }

    // ==================== FORGET ====================
    function sendOTP() {
        const email = document.getElementById('forgotEmail').value.trim();
        if (!email) {
            showToast('⚠️ Gmail लेख्नुहोस्!');
            return;
        }

        const file = files.find(f => f.email === email);
        if (!file) {
            showToast('❌ यो Gmail सँग कुनै फाइल छैन!');
            return;
        }

        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        otpStorage[email] = otp;

        document.getElementById('otpSection').style.display = 'block';
        document.getElementById('verifyBtn').style.display = 'block';
        document.getElementById('forgotResult').style.display = 'block';
        document.getElementById('forgotResult').innerHTML = `
            <div style="background:#e8f5e9; padding:15px; border-radius:12px; color:#2e7d32;">
                ✅ OTP: <strong>${otp}</strong> (Demo)
            </div>
        `;
        showToast('📨 OTP: ' + otp);
    }

    function verifyOTP() {
        const email = document.getElementById('forgotEmail').value.trim();
        const enteredOtp = document.getElementById('otpInput').value.trim();
        const storedOtp = otpStorage[email];

        if (!enteredOtp) {
            showToast('⚠️ OTP लेख्नुहोस्!');
            return;
        }

        if (enteredOtp === storedOtp) {
            const file = files.find(f => f.email === email);
            if (file) {
                document.getElementById('forgotResult').innerHTML = `
                    <div style="background:#e8f5e9; padding:15px; border-radius:12px;">
                        ✅ Verified! ID: <strong>${file.id}</strong> | Name: ${file.name}
                        <br><button class="btn-primary" onclick="openFile('${file.id}')" style="margin-top:15px; padding:10px 30px;">📂 Open</button>
                    </div>
                `;
                showToast('✅ Verified!');
            }
        } else {
            showToast('❌ OTP मिलेन!');
        }
    }

    // ==================== TOAST ====================
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    // ==================== AUTO OPEN ====================
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            const file = files.find(f => f.id === id);
            if (file) openFile(id);
        }
    };
</script>

</body>
</html>
