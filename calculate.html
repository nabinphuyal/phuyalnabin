
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nabin Note App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* Home Page */
        #homePage { text-align: center; padding: 80px 20px; }
        #homePage h1 { font-size: 3rem; color: #1a2634; margin-bottom: 10px; }
        #homePage .subtitle { color: #666; font-size: 1.2rem; margin-bottom: 40px; }
        .btn-primary { 
            background: linear-gradient(90deg, #1a2634, #2c3e50); 
            color: white; padding: 18px 50px; border: none; 
            border-radius: 50px; font-size: 1.2rem; font-weight: 600; 
            cursor: pointer; transition: 0.4s; box-shadow: 0 8px 25px rgba(26,38,52,0.3);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(26,38,52,0.4); }
        .btn-secondary { 
            background: #eef2f6; color: #1a2634; padding: 14px 35px; 
            border: 2px solid #1a2634; border-radius: 50px; font-size: 1rem; 
            font-weight: 600; cursor: pointer; transition: 0.4s; margin: 10px;
        }
        .btn-secondary:hover { background: #1a2634; color: white; }
        .btn-danger { background: #d32f2f; color: white; padding: 12px 30px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-danger:hover { background: #b71c1c; transform: scale(1.02); }
        .btn-success { background: #2e7d32; color: white; padding: 12px 30px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-success:hover { background: #1b5e20; transform: scale(1.02); }
        
        /* Create Page */
        #createPage, #notePage, #forgotPage { display: none; padding: 40px 20px; background: white; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-top: 20px; }
        .form-group { margin: 20px 0; }
        .form-group label { display: block; font-weight: 600; color: #1a2634; margin-bottom: 8px; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 14px 20px; border: 2px solid #eef2f6; 
            border-radius: 15px; font-size: 1rem; transition: 0.3s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #1a2634; box-shadow: 0 0 0 4px rgba(26,38,52,0.1); }
        .form-group textarea { height: 120px; resize: vertical; }
        
        .input-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .input-group input { flex: 1; min-width: 200px; }
        
        .note-list { margin-top: 30px; }
        .note-item { 
            display: flex; align-items: center; gap: 15px; 
            padding: 12px 20px; background: #f8fafd; border-radius: 12px; 
            margin-bottom: 8px; border-left: 4px solid #1a2634;
        }
        .note-item .num { font-weight: 700; color: #1a2634; min-width: 40px; font-size: 1.1rem; }
        .note-item .content { flex: 1; color: #333; }
        .note-item .delete-btn { background: none; border: none; color: #d32f2f; font-size: 1.2rem; cursor: pointer; padding: 5px 10px; border-radius: 8px; transition: 0.3s; }
        .note-item .delete-btn:hover { background: #ffebee; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eef2f6; }
        .header-bar h2 { color: #1a2634; }
        .file-info { background: #eef2f6; padding: 8px 20px; border-radius: 20px; font-weight: 600; color: #1a2634; }
        
        .action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
        
        .watermark-demo { 
            position: fixed; bottom: 10px; right: 10px; 
            font-size: 0.7rem; color: rgba(0,0,0,0.05); 
            pointer-events: none; z-index: 0;
            font-weight: 700; letter-spacing: 2px;
        }
        
        .total-display { 
            background: linear-gradient(90deg, #1a2634, #2c3e50); 
            color: white; padding: 15px 25px; border-radius: 15px; 
            text-align: center; font-size: 1.2rem; font-weight: 600; 
            margin: 15px 0; 
        }
        
        .forgot-link { color: #1a2634; cursor: pointer; text-decoration: underline; font-weight: 500; }
        .forgot-link:hover { color: #d32f2f; }
        
        .toast { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #1a2634; color: white; padding: 15px 30px; 
            border-radius: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            display: none; z-index: 999; animation: slideUp 0.4s;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .back-btn { background: none; border: none; color: #1a2634; font-size: 1.5rem; cursor: pointer; padding: 5px 15px; }
        .back-btn:hover { color: #d32f2f; }
        
        @media (max-width: 600px) {
            #homePage h1 { font-size: 2rem; }
            .input-group { flex-direction: column; }
            .header-bar { flex-direction: column; text-align: center; }
            .action-bar { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="watermark-demo">NABIN</div>

<div id="toast" class="toast"></div>

<div class="container">

    <!-- ========== HOME PAGE ========== -->
    <div id="homePage">
        <h1>📝 Nabin Note</h1>
        <p class="subtitle">तपाईंको नोटहरू सुरक्षित राख्नुहोस्</p>
        <button class="btn-primary" onclick="showCreatePage()">+ Create New File</button>
        <br><br>
        <button class="btn-secondary" onclick="showForgotPage()">🔑 Forget ID ?</button>
    </div>

    <!-- ========== CREATE PAGE ========== -->
    <div id="createPage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>📄 Create New File</h2>
            <span></span>
        </div>
        
        <div class="form-group">
            <label>👤 Full Name</label>
            <input type="text" id="createName" placeholder="तपाईंको नाम लेख्नुहोस्">
        </div>
        
        <div class="form-group">
            <label>🆔 File ID (जस्तै: 2343)</label>
            <input type="number" id="createId" placeholder="Enter unique ID" min="1000" max="9999">
        </div>
        
        <div class="form-group">
            <label>📧 Gmail (For password reset)</label>
            <input type="email" id="createEmail" placeholder="your@gmail.com">
        </div>
        
        <button class="btn-primary" onclick="createFile()" style="width:100%;">✅ Create File</button>
        <p style="text-align:center; margin-top:15px; font-size:0.9rem; color:#666;">
            ⚠️ ID 1000-9999 सम्म मात्र, पहिले नै प्रयोग भएको ID लिँदा error देखाउँछ।
        </p>
    </div>

    <!-- ========== FORGOT PAGE ========== -->
    <div id="forgotPage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>🔑 Forgot ID / Password</h2>
            <span></span>
        </div>
        
        <div class="form-group">
            <label>📧 आफ्नो Gmail लेख्नुहोस्</label>
            <input type="email" id="forgotEmail" placeholder="your@gmail.com">
        </div>
        
        <div class="form-group" id="otpSection" style="display:none;">
            <label>🔢 OTP Code (तपाईंको Gmail मा पठाइयो)</label>
            <input type="text" id="otpInput" placeholder="Enter OTP">
        </div>
        
        <button class="btn-primary" onclick="sendOTP()" style="width:100%;">📨 Send OTP</button>
        <button class="btn-secondary" onclick="verifyOTP()" style="width:100%; margin-top:10px;" id="verifyBtn" style="display:none;">✅ Verify & Reset</button>
        
        <div id="forgotResult" style="margin-top:20px; padding:15px; background:#f8fafd; border-radius:15px; display:none;"></div>
    </div>

    <!-- ========== NOTE PAGE ========== -->
    <div id="notePage">
        <div class="header-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <div>
                <h2>📝 My Notes</h2>
                <span class="file-info" id="fileInfo">📁 ID: ---- | 👤 ----</span>
            </div>
            <div>
                <button class="btn-danger" onclick="deleteFile()" style="padding:8px 20px; font-size:0.9rem;">🗑️ Delete File</button>
            </div>
        </div>
        
        <!-- Note Input -->
        <div class="form-group">
            <label>✏️ नयाँ नोट लेख्नुहोस्</label>
            <div class="input-group">
                <input type="text" id="noteInput" placeholder="तपाईंको नोट..." onkeypress="if(event.key==='Enter') addNote()">
                <button class="btn-primary" onclick="addNote()" style="padding:12px 30px;">➕ Add</button>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-bar">
            <button class="btn-secondary" onclick="downloadPDF(false)">📥 PDF (सबै)</button>
            <button class="btn-success" onclick="downloadPDF(true)">📊 PDF + Total</button>
            <button class="btn-secondary" onclick="calculateTotal()" style="background:#ffd700; border-color:#ffd700;">🧮 Calculate Total</button>
        </div>
        
        <!-- Total Display -->
        <div id="totalDisplay" class="total-display" style="display:none;">
            📊 Total: <span id="totalValue">0</span>
        </div>
        
        <!-- Notes List -->
        <div class="note-list" id="noteList">
            <p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन। माथि लेख्नुहोस्!</p>
        </div>
    </div>

</div>

<script>
    // ==================== DATA STORAGE ====================
    let files = JSON.parse(localStorage.getItem('nabinFiles')) || [];
    let currentFile = null;
    let currentNotes = [];
    let otpStorage = {};

    // ==================== HOME FUNCTIONS ====================
    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'none';
        currentFile = null;
        currentNotes = [];
    }

    function showCreatePage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('createPage').style.display = 'block';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'none';
    }

    function showForgotPage() {
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'none';
        document.getElementById('forgotPage').style.display = 'block';
        document.getElementById('otpSection').style.display = 'none';
        document.getElementById('verifyBtn').style.display = 'none';
        document.getElementById('forgotResult').style.display = 'none';
    }

    // ==================== CREATE FILE ====================
    function createFile() {
        const name = document.getElementById('createName').value.trim();
        const id = document.getElementById('createId').value.trim();
        const email = document.getElementById('createEmail').value.trim();

        if (!name || !id || !email) {
            showToast('⚠️ कृपया सबै फिल्ड भर्नुहोस्!');
            return;
        }

        if (id.length < 4 || id.length > 4 || isNaN(id)) {
            showToast('⚠️ ID ४ अंकको (१०००-९९९९) मात्र हुनुपर्छ!');
            return;
        }

        // Check if ID already exists
        if (files.find(f => f.id === id)) {
            showToast('❌ यो ID पहिले नै प्रयोग भइसकेको छ! कृपया अर्को ID प्रयोग गर्नुहोस्।');
            return;
        }

        // Check if email already linked (optional)
        const existingEmail = files.find(f => f.email === email);
        if (existingEmail) {
            showToast('⚠️ यो Gmail अर्को फाइलसँग लिङ्क भइसकेको छ!');
            return;
        }

        const newFile = {
            id: id,
            name: name,
            email: email,
            notes: [],
            createdAt: new Date().toISOString()
        };

        files.push(newFile);
        localStorage.setItem('nabinFiles', JSON.stringify(files));

        showToast('✅ File Created Successfully! ID: ' + id);
        
        // Auto-open the file
        openFile(id);
    }

    // ==================== OPEN FILE ====================
    function openFile(id) {
        const file = files.find(f => f.id === id);
        if (!file) {
            showToast('❌ File not found!');
            return;
        }

        currentFile = file;
        currentNotes = file.notes || [];

        document.getElementById('homePage').style.display = 'none';
        document.getElementById('createPage').style.display = 'none';
        document.getElementById('notePage').style.display = 'block';
        document.getElementById('forgotPage').style.display = 'none';

        document.getElementById('fileInfo').innerHTML = `📁 ID: ${file.id} | 👤 ${file.name}`;
        renderNotes();

        // Clear create form
        document.getElementById('createName').value = '';
        document.getElementById('createId').value = '';
        document.getElementById('createEmail').value = '';
    }

    // ==================== NOTES ====================
    function addNote() {
        const input = document.getElementById('noteInput');
        const text = input.value.trim();
        if (!text) { showToast('⚠️ केही लेख्नुहोस्!'); return; }

        currentNotes.push(text);
        saveNotes();
        renderNotes();
        input.value = '';
        input.focus();
        showToast('✅ Note added!');
    }

    function deleteNote(index) {
        currentNotes.splice(index, 1);
        saveNotes();
        renderNotes();
        showToast('🗑️ Note deleted!');
    }

    function saveNotes() {
        if (currentFile) {
            const fileIndex = files.findIndex(f => f.id === currentFile.id);
            if (fileIndex !== -1) {
                files[fileIndex].notes = currentNotes;
                localStorage.setItem('nabinFiles', JSON.stringify(files));
            }
        }
    }

    function renderNotes() {
        const container = document.getElementById('noteList');
        if (currentNotes.length === 0) {
            container.innerHTML = `<p style="color:#999; text-align:center; padding:30px 0;">अहिलेसम्म कुनै नोट छैन। माथि लेख्नुहोस्!</p>`;
            document.getElementById('totalDisplay').style.display = 'none';
            return;
        }

        let html = '';
        currentNotes.forEach((note, i) => {
            html += `
                <div class="note-item">
                    <span class="num">${i + 1}.</span>
                    <span class="content">${escapeHTML(note)}</span>
                    <button class="delete-btn" onclick="deleteNote(${i})">✕</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== DELETE FILE ====================
    function deleteFile() {
        if (!currentFile) return;
        if (confirm(`⚠️ के तपाईं ${currentFile.id} (${currentFile.name}) फाइल मेटाउन चाहनुहुन्छ? यो स्थायी हुन्छ!`)) {
            files = files.filter(f => f.id !== currentFile.id);
            localStorage.setItem('nabinFiles', JSON.stringify(files));
            showToast('🗑️ File deleted!');
            goHome();
        }
    }

    // ==================== CALCULATE TOTAL ====================
    function calculateTotal() {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन!');
            return;
        }

        let total = 0;
        let allNumbers = true;

        currentNotes.forEach(note => {
            const num = parseFloat(note);
            if (!isNaN(num)) {
                total += num;
            } else {
                allNumbers = false;
            }
        });

        const display = document.getElementById('totalDisplay');
        const value = document.getElementById('totalValue');

        if (allNumbers) {
            value.textContent = total.toFixed(2);
        } else {
            value.textContent = '⚠️ सबै नोट numbers छैनन्! गणना गर्न मिलेन।';
        }
        display.style.display = 'block';
    }

    // ==================== PDF DOWNLOAD ====================
    function downloadPDF(includeTotal) {
        if (currentNotes.length === 0) {
            showToast('⚠️ कुनै नोट छैन! पहिले केही लेख्नुहोस्।');
            return;
        }

        // Build content for PDF
        let content = `
            <div style="font-family: 'Poppins', sans-serif; padding: 30px; max-width: 800px; margin: auto; position: relative;">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 80px; color: rgba(0,0,0,0.03); font-weight: 700; pointer-events: none; white-space: nowrap; z-index: 0;">
                    NABIN
                </div>
                <div style="position: relative; z-index: 1;">
                    <h1 style="color: #1a2634; border-bottom: 3px solid #1a2634; padding-bottom: 10px;">
                        📝 My Notes
                    </h1>
                    <p style="color: #666; margin-bottom: 20px;">
                        <strong>ID:</strong> ${currentFile.id} | 
                        <strong>Name:</strong> ${currentFile.name} | 
                        <strong>Date:</strong> ${new Date().toLocaleDateString()}
                    </p>
                    <hr style="margin: 20px 0; border-color: #eef2f6;">
        `;

        let total = 0;
        let allNumbers = true;

        currentNotes.forEach((note, i) => {
            content += `
                <div style="display: flex; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #f0f4f8; gap: 15px;">
                    <span style="font-weight: 700; color: #1a2634; min-width: 40px;">${i+1}.</span>
                    <span style="flex: 1; color: #333;">${escapeHTML(note)}</span>
                </div>
            `;
            
            const num = parseFloat(note);
            if (!isNaN(num)) total += num;
            else allNumbers = false;
        });

        if (includeTotal) {
            if (allNumbers) {
                content += `
                    <div style="margin-top: 20px; background: #1a2634; color: white; padding: 15px 20px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 1.2rem;">
                        📊 Total: ${total.toFixed(2)}
                    </div>
                `;
            } else {
                content += `
                    <div style="margin-top: 20px; background: #ffebee; color: #d32f2f; padding: 15px 20px; border-radius: 12px; text-align: center; font-weight: 600;">
                        ⚠️ सबै नोट numbers छैनन्, total गणना गर्न मिलेन।
                    </div>
                `;
            }
        }

        content += `
                    <p style="margin-top: 30px; text-align: center; color: #999; font-size: 0.8rem; border-top: 2px solid #eef2f6; padding-top: 20px;">
                        Generated by Nabin Note App | © 2025 Nabin Phuyal
                    </p>
                </div>
            </div>
        `;

        const element = document.createElement('div');
        element.innerHTML = content;
        document.body.appendChild(element);

        const opt = {
            margin:        [0.5, 0.5, 0.5, 0.5],
            filename:     `notes_${currentFile.id}_${new Date().toISOString().slice(0,10)}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, letterRendering: true },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.removeChild(element);
            showToast('✅ PDF Download Success!');
        }).catch(err => {
            document.body.removeChild(element);
            showToast('❌ PDF download error!');
            console.error(err);
        });
    }

    // ==================== FORGET ID / OTP ====================
    function sendOTP() {
        const email = document.getElementById('forgotEmail').value.trim();
        if (!email) {
            showToast('⚠️ कृपया Gmail लेख्नुहोस्!');
            return;
        }

        // Check if email exists
        const file = files.find(f => f.email === email);
        if (!file) {
            showToast('❌ यो Gmail सँग कुनै फाइल लिङ्क छैन!');
            return;
        }

        // Generate OTP (4 digit)
        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        otpStorage[email] = otp;

        // Show OTP section
        document.getElementById('otpSection').style.display = 'block';
        document.getElementById('verifyBtn').style.display = 'block';
        document.getElementById('forgotResult').style.display = 'block';
        document.getElementById('forgotResult').innerHTML = `
            <div style="background:#e8f5e9; padding:15px; border-radius:12px; color:#2e7d32;">
                ✅ OTP पठाइयो! <br>
                <strong>${otp}</strong> (Demo: यो OTP तपाईंको Gmail मा गएको हुन्थ्यो)
            </div>
        `;
        
        showToast('📨 OTP sent! (Demo: ' + otp + ')');
    }

    function verifyOTP() {
        const email = document.getElementById('forgotEmail').value.trim();
        const enteredOtp = document.getElementById('otpInput').value.trim();
        const storedOtp = otpStorage[email];

        if (!enteredOtp) {
            showToast('⚠️ कृपया OTP लेख्नुहोस्!');
            return;
        }

        if (enteredOtp === storedOtp) {
            const file = files.find(f => f.email === email);
            if (file) {
                document.getElementById('forgotResult').innerHTML = `
                    <div style="background:#e8f5e9; padding:15px; border-radius:12px;">
                        ✅ Verified! तपाईंको File ID: <strong>${file.id}</strong> <br>
                        👤 Name: ${file.name} <br>
                        <button class="btn-primary" onclick="openFile('${file.id}')" style="margin-top:15px; padding:10px 30px;">
                            📂 Open File
                        </button>
                    </div>
                `;
                showToast('✅ Verified successfully!');
            }
        } else {
            showToast('❌ OTP मिलेन! पुन: प्रयास गर्नुहोस्।');
        }
    }

    // ==================== TOAST ====================
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }

    // ==================== CHECK URL PARAMS (auto-open) ====================
    // Optional: if you want to open file via ?id=2343
